services:
  - type: web
    name: tuition-teacher-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tuition-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: GMAIL_WEBHOOK_URL
        sync: false
      - key: GMAIL_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        value: https://tuition-teacher-app.onrender.com
databases:
  - name: tuition-db
    plan: free
